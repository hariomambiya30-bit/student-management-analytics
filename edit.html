```html
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Update Student Details</h1>

    <form action="{{ url_for('update_student', id=student.id) }}"
          method="POST">

        <input type="text"
               name="name"
               value="{{ student.name }}"
               placeholder="Student Name"
               required>

        <input type="email"
               name="email"
               value="{{ student.email }}"
               placeholder="Email"
               required>

        <input type="text"
               name="course"
               value="{{ student.course }}"
               placeholder="Course"
               required>

        <input type="number"
               name="marks"
               value="{{ student.marks }}"
               min="0"
               max="100"
               step="0.01"
               required>

        <input type="number"
               name="attendance"
               value="{{ student.attendance }}"
               min="0"
               max="100"
               step="0.01"
               required>

        <button type="submit">Update Student</button>

    </form>

    <a href="{{ url_for('home') }}">Back to Dashboard</a>

</div>

</body>
</html>
